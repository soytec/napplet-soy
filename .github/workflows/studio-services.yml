name: Studio services

on:
  pull_request:
    paths:
      - '.github/workflows/studio-services.yml'
      - 'apps/studio/**'
      - 'apps/web/**'
      - 'apps/cli/**'
      - 'packages/**'
      - 'services/**'
      - 'scripts/grasp*'
      - 'scripts/relay*'
      - 'tests/services/publish-stack.ts'
      - 'tests/services/studio-proposal.test.ts'
      - 'tests/services/studio-browser-git.test.ts'
      - 'tests/services/studio-shell.test.ts'
      - 'tests/services/studio-preview.test.ts'
      - 'tests/services/studio-original-preview.test.ts'
      - 'tests/services/studio-publication.test.ts'
      - 'tests/services/publish-check.test.ts'
      - 'tests/services/fixtures/publication-server.ts'
      - 'tests/services/fixtures/studio-publication.tsx'
      - 'tests/services/fixtures/capture-failure.ts'
      - 'tests/services/keys-preview.test.ts'
      - 'tests/services/rich-comments.test.ts'
      - 'tests/services/fixtures/studio-original-preview.tsx'
      - 'tests/services/studio-remix-network.test.ts'
      - 'scripts/test-studio-remix-network.sh'
      - 'tests/services/fixtures/studio-browser-git.worker.ts'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remix-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2 openssl
      - name: Import a remix through the actual Studio egress policy
        run: bash scripts/test-studio-remix-network.sh
  proposals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.25.0
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - name: Install native service prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
          studio_rust="$(bun -e 'import pin from "./services/grasp/upstream.json"; process.stdout.write(pin.rust)')"
          rustup toolchain install "$studio_rust" --profile minimal
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$studio_rust" >> "$GITHUB_ENV"
          go version
      - name: Install browser test prerequisites
        run: bunx playwright install --with-deps chromium
      - name: Verify relay COUNT, synchronization and compatibility patches
        run: bun run test:relay
      - name: Build pinned services and verify proposals and browser Git
        # Keep Chromium and Bun's embedded service servers in separate processes;
        # combining the suites can stall service teardown on Linux.
        run: bun run test:studio:services
      - name: Verify contribution history and exact author payments
        run: bun test apps/web/src/lib/contribution-history.test.ts packages/community/src/zaps.test.ts packages/client/src/zap-payments.test.ts
      - name: Verify production shell and Studio account composition
        run: bun run build && bun test tests/services/studio-shell.test.ts && bun test tests/services/studio-preview.test.ts
      - name: Verify initial remix gameplay and preview transitions
        run: bun test tests/services/studio-original-preview.test.ts
      - name: Verify update publication and sandbox media capture
        run: bun test tests/services/studio-publication.test.ts && bun test tests/services/publish-check.test.ts
      - name: Verify napplet sessions survive visibility changes
        run: bun test tests/services/keys-preview.test.ts && bun test tests/services/rich-comments.test.ts
